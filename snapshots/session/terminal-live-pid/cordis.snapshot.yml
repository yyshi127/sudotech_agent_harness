# Keyless allocation and model replay for the same terminal composition.
- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: skill-filesystem
  config:
    includeDefaultRoots: false

- insert:
    - id: terminal-live-pid-native
      name: './native-fixture.mjs'
    - id: terminal-live-pid-registry
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-live-pid-shell
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        shellDialect: bash
        shellPath: snapshot-controlled-shell
        pollIntervalMs: 5
        exactProbeAfterMs: 10
        idleSilenceMs: 20
        handoffGraceMs: 10
        timeoutMs: 1500
        disposeGraceMs: 20
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high
                systemPromptUpdate: in-history
